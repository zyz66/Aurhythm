<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00b4d8"/>
    </marker>
    <marker id="arrowheadLook" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c792ea"/>
    </marker>
  </defs>

  <rect width="1060" height="1560" fill="#141414"/>

  <text x="530" y="40" fill="#e0e0e0" font-size="22" font-weight="bold" text-anchor="middle">Aurhythm v5.0 — 胶片 Cineon / LogC3 校准流程</text>
  <text x="530" y="64" fill="#8a8a8a" font-size="13" text-anchor="middle">物理映射，而非经验调色 · 阶段 ①–⑥ 一律不裁剪</text>

  <g>
    <rect x="300" y="90" width="460" height="46" rx="6" fill="#1f3b4d" stroke="#00b4d8"/>
    <text x="530" y="112" fill="#e0e0e0" text-anchor="middle" font-weight="bold">① 输入：RAW（rawpy 懒加载）/ 16-bit TIFF / PNG</text>
    <text x="530" y="129" fill="#8a8a8a" text-anchor="middle" font-size="11">RAW 按 gamma=(1,1)、no_auto_bright、output_color=raw 解码 → 相机原生线性</text>

    <rect x="300" y="156" width="460" height="42" rx="6" fill="#1f3b4d" stroke="#00b4d8"/>
    <text x="530" y="182" fill="#e0e0e0" text-anchor="middle">② 白平衡（AsShotNeutral / 手动对角增益）</text>

    <rect x="300" y="218" width="460" height="54" rx="6" fill="#1f3b4d" stroke="#00b4d8"/>
    <text x="530" y="240" fill="#e0e0e0" text-anchor="middle" font-weight="bold">③ 相机 profile：ICC / DCP → XYZ(D50) → Bradford → 线性 sRGB(D65)</text>
    <text x="530" y="258" fill="#8a8a8a" text-anchor="middle" font-size="11">双光源矩阵按权重插值 · LUT 型 ICC 明确报错，绝不静默用单位矩阵</text>

    <rect x="300" y="292" width="460" height="42" rx="6" fill="#1f3b4d" stroke="#00b4d8"/>
    <text x="530" y="318" fill="#e0e0e0" text-anchor="middle">④ 色卡矫正（3×3 / 3×3+offset，岭回归，ΔE2000 报告）</text>

    <rect x="300" y="354" width="460" height="42" rx="6" fill="#1f3b4d" stroke="#00b4d8"/>
    <text x="530" y="380" fill="#e0e0e0" text-anchor="middle">⑤ 通道增益（印片光式，逐通道线性增益）</text>

    <rect x="300" y="416" width="460" height="62" rx="6" fill="#1f3b4d" stroke="#00b4d8"/>
    <text x="530" y="438" fill="#e0e0e0" text-anchor="middle" font-weight="bold">⑥ 密度 D = −log₁₀(v / base_aligned)</text>
    <text x="530" y="456" fill="#8a8a8a" text-anchor="middle" font-size="11">base_aligned = 片基采样推过 ②–④，逐通道保留（不再覆盖成标量灰）</text>
    <text x="530" y="471" fill="#8a8a8a" text-anchor="middle" font-size="11">只在下界保护 log，允许 D &lt; 0；越窗只统计、不丢信息</text>

    <rect x="300" y="498" width="460" height="42" rx="6" fill="#1f3b4d" stroke="#00b4d8"/>
    <text x="530" y="524" fill="#e0e0e0" text-anchor="middle">⑦ 解串扰矩阵（染料层分离，负染料密度钳零）</text>

    <rect x="240" y="560" width="580" height="96" rx="6" fill="#20402f" stroke="#00d47a"/>
    <text x="530" y="584" fill="#e0e0e0" text-anchor="middle" font-weight="bold" font-size="15">⑧ 非线性校正：胶片特性曲线（作用在归一化密度域）</text>
    <text x="530" y="606" fill="#c9f5dd" text-anchor="middle" font-size="11">toe(t) = s_t·softplus(a_in·(t − t_c)/s_t)　　t′(t) = 1 − s_s·softplus((1 − toe)/s_s)</text>
    <text x="530" y="624" fill="#8a8a8a" text-anchor="middle" font-size="11">严格单调由构造保证（可证）· 中点与中段斜率闭式精确 · 实用端点有限 → 逆解良态</text>
    <text x="530" y="642" fill="#8a8a8a" text-anchor="middle" font-size="11">t = (D − d_min)/(d_max − d_min)　→　t′　（512 级输入 → 512 级输出）</text>

    <rect x="240" y="676" width="580" height="76" rx="6" fill="#20402f" stroke="#00d47a"/>
    <text x="530" y="700" fill="#e0e0e0" text-anchor="middle" font-weight="bold" font-size="15">⑨ Cineon 编码（编码的是密度，不是场景曝光）</text>
    <text x="530" y="722" fill="#c9f5dd" text-anchor="middle" font-size="11">auto_fit（默认）：整个输入密度窗口 → 参考黑 95 / 参考白 685</text>
    <text x="530" y="740" fill="#8a8a8a" text-anchor="middle" font-size="11">关掉 auto_fit：500 codes / 1.0 密度单位（Cineon 标准），末端裁剪 [0,1023]</text>

    <rect x="300" y="772" width="460" height="42" rx="6" fill="#1f3b4d" stroke="#00b4d8"/>
    <text x="530" y="798" fill="#e0e0e0" text-anchor="middle">⑩ 可选 LogC3：E = 0.90·10^((code−685)/500) → ARRI LogC3</text>

    <rect x="300" y="834" width="460" height="46" rx="6" fill="#1f3b4d" stroke="#00b4d8"/>
    <text x="530" y="856" fill="#e0e0e0" text-anchor="middle" font-weight="bold">⑪ 导出：TIFF 16/32 · DPX 10-bit · EXR（+ provenance）</text>
    <text x="530" y="873" fill="#8a8a8a" text-anchor="middle" font-size="11">TIFF 内嵌完整参数；DPX/EXR 另写 .json sidecar</text>
  </g>

  <g stroke="#00b4d8" stroke-width="2" marker-end="url(#arrowhead)" fill="none">
    <line x1="530" y1="136" x2="530" y2="154"/>
    <line x1="530" y1="198" x2="530" y2="216"/>
    <line x1="530" y1="272" x2="530" y2="290"/>
    <line x1="530" y1="334" x2="530" y2="352"/>
    <line x1="530" y1="396" x2="530" y2="414"/>
    <line x1="530" y1="478" x2="530" y2="496"/>
    <line x1="530" y1="540" x2="530" y2="558"/>
    <line x1="530" y1="656" x2="530" y2="674"/>
    <line x1="530" y1="752" x2="530" y2="770"/>
    <line x1="530" y1="814" x2="530" y2="832"/>
    <line x1="530" y1="880" x2="530" y2="898"/>
  </g>

  <g>
    <rect x="30" y="218" width="240" height="158" rx="6" fill="#2a2333" stroke="#8a8a8a"/>
    <text x="150" y="242" fill="#e0e0e0" text-anchor="middle" font-weight="bold">测量依据（测量，非调色）</text>
    <text x="46" y="264" fill="#b9b9b9" font-size="11">• 片基采样（多点取中位数）</text>
    <text x="46" y="282" fill="#b9b9b9" font-size="11">• 自动片基：掩膜 ≥ 分位 + 中位数</text>
    <text x="46" y="300" fill="#b9b9b9" font-size="11">• 密度域中性化（逐通道对齐）</text>
    <text x="46" y="318" fill="#b9b9b9" font-size="11">• 色卡 ΔE2000（CIEDE2000）</text>
    <text x="46" y="336" fill="#b9b9b9" font-size="11">• 越窗 / 裁剪统计（透明化）</text>
    <text x="46" y="354" fill="#b9b9b9" font-size="11">• 密度直方图与达成密度</text>
    <text x="46" y="372" fill="#b9b9b9" font-size="11">• 色彩矩阵由色度坐标推导</text>

    <rect x="790" y="90" width="240" height="188" rx="6" fill="#2a2333" stroke="#8a8a8a"/>
    <text x="910" y="114" fill="#e0e0e0" text-anchor="middle" font-weight="bold">标准锚点（有测试守护）</text>
    <text x="806" y="138" fill="#b9b9b9" font-size="11">参考黑　code 95</text>
    <text x="806" y="158" fill="#b9b9b9" font-size="11">参考白　code 685（90% 白卡）</text>
    <text x="806" y="178" fill="#b9b9b9" font-size="11">编码密度　500 codes/decade</text>
    <text x="806" y="196" fill="#b9b9b9" font-size="11">　　= 150.515 codes / 档</text>
    <text x="806" y="218" fill="#b9b9b9" font-size="11">18% 中灰　code 335.515</text>
    <text x="806" y="236" fill="#b9b9b9" font-size="11">　→ LogC3 0.391007（ARRI）</text>
    <text x="806" y="256" fill="#b9b9b9" font-size="11">cut 点连续　0.149658</text>

    <rect x="790" y="330" width="240" height="160" rx="6" fill="#2a2333" stroke="#8a8a8a"/>
    <text x="910" y="354" fill="#e0e0e0" text-anchor="middle" font-weight="bold">色彩学</text>
    <text x="806" y="378" fill="#b9b9b9" font-size="11">PCS = D50（ICC 与 DNG 一致）</text>
    <text x="806" y="396" fill="#b9b9b9" font-size="11">工作空间 = 线性 sRGB(D65)</text>
    <text x="806" y="414" fill="#b9b9b9" font-size="11">Bradford 色适应</text>
    <text x="806" y="432" fill="#b9b9b9" font-size="11">ΔE2000（Sharma 34 向量通过）</text>
    <text x="806" y="450" fill="#b9b9b9" font-size="11">矩阵由色度坐标运行时推导</text>
    <text x="806" y="468" fill="#b9b9b9" font-size="11">白点：xy 现算，自洽优先</text>
  </g>

  <g>
    <rect x="240" y="930" width="580" height="152" rx="6" fill="#2c2436" stroke="#c792ea" stroke-dasharray="6 4"/>
    <text x="530" y="956" fill="#c792ea" text-anchor="middle" font-weight="bold" font-size="15">调色层（可选 · 非校准 · 默认全部恒等）</text>
    <text x="530" y="980" fill="#b9b9b9" text-anchor="middle" font-size="11">曝光基准（Cineon 标度平移）· 对比度（绕 18% 中灰旋转）</text>
    <text x="530" y="999" fill="#b9b9b9" text-anchor="middle" font-size="11">ASC-CDL：Lift(offset) / Gamma(power) / Gain(slope)，主控 + R/G/B</text>
    <text x="530" y="1018" fill="#b9b9b9" text-anchor="middle" font-size="11">分通道单调曲线（Fritsch–Carlson PCHIP）</text>
    <text x="530" y="1042" fill="#8a8a8a" text-anchor="middle" font-size="11">导出 .cube 时默认不烘入这些参数；勾选「含调色层」才会包含</text>
    <text x="530" y="1062" fill="#8a8a8a" text-anchor="middle" font-size="11">它们只作用于 code 域，不改变 ①–⑨ 的物理映射</text>
  </g>
  <g stroke="#c792ea" stroke-width="2" marker-end="url(#arrowheadLook)" fill="none">
    <path d="M240 1005 L185 1005 L185 795 L298 795"/>
  </g>
  <text x="150" y="1000" fill="#c792ea" font-size="11" text-anchor="middle">可选插入</text>

  <g>
    <rect x="240" y="1110" width="580" height="104" rx="6" fill="#1f3b4d" stroke="#00b4d8"/>
    <text x="530" y="1136" fill="#e0e0e0" text-anchor="middle" font-weight="bold">显示变换（所见即所得）</text>
    <text x="530" y="1158" fill="#b9b9b9" text-anchor="middle" font-size="11">导出数据 → 还原线性曝光 E → 显示曝光/伽马 → sRGB 编码 → uint8</text>
    <text x="530" y="1178" fill="#8a8a8a" text-anchor="middle" font-size="11">预览与导出共用同一份数据，有测试断言两者严格一致</text>
    <text x="530" y="1198" fill="#8a8a8a" text-anchor="middle" font-size="11">另提供假色、直方图、波形、RGB parade、矢量示波器数据</text>
  </g>
  <g stroke="#00b4d8" stroke-width="2" marker-end="url(#arrowhead)" fill="none">
    <path d="M820 855 L900 855 L900 1108 L820 1108"/>
  </g>

  <g>
    <rect x="50" y="1250" width="450" height="126" rx="6" fill="#22303a" stroke="#8a8a8a"/>
    <text x="275" y="1276" fill="#e0e0e0" text-anchor="middle" font-weight="bold">输出</text>
    <text x="70" y="1300" fill="#b9b9b9" font-size="11">TIFF 16-bit / 32-bit float（无依赖内置写出器 + tifffile 优先）</text>
    <text x="70" y="1318" fill="#b9b9b9" font-size="11">DPX 10-bit（SMPTE 268M，packing 1，位精确往返有测试）</text>
    <text x="70" y="1336" fill="#b9b9b9" font-size="11">EXR half / float（需 imageio）</text>
    <text x="70" y="1354" fill="#b9b9b9" font-size="11">.cube 校准变换（可选含调色层）</text>

    <rect x="560" y="1250" width="450" height="126" rx="6" fill="#22303a" stroke="#8a8a8a"/>
    <text x="785" y="1276" fill="#e0e0e0" text-anchor="middle" font-weight="bold">工程</text>
    <text x="580" y="1300" fill="#b9b9b9" font-size="11">参数注册表（UI 键空间唯一来源，杜绝死控件）</text>
    <text x="580" y="1318" fill="#b9b9b9" font-size="11">参数快照 JSON + v4 迁移（未知键明确报告）</text>
    <text x="580" y="1336" fill="#b9b9b9" font-size="11">批量：完整 profile 路径 · 工作线程 · 可取消</text>
    <text x="580" y="1354" fill="#b9b9b9" font-size="11">285 个 unittest，无 tkinter/rawpy 也能全绿</text>
  </g>

  <text x="530" y="1424" fill="#8a8a8a" font-size="11" text-anchor="middle">依赖边界：只有 app.py 可 import tkinter；io_read / io_write 懒加载 rawpy / tifffile / Pillow / imageio</text>
  <text x="530" y="1446" fill="#8a8a8a" font-size="11" text-anchor="middle">色彩科学：ICC 与 DNG 的 PCS 均为 D50；工作空间固定为线性 sRGB(D65)</text>
  <text x="530" y="1478" fill="#c792ea" font-size="11" text-anchor="middle">调色控件默认恒等 —— 本工具的身份是校准器，不是调色台</text>
</svg>
